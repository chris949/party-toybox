# チェックと公開（方針は docs/dependency-policy.md の3章）
#   PR       → チェック（脆弱性・型・テスト・画面の通しテスト・ビルド）。main のルールで、通らないとマージできない
#   main     → ビルドして GitHub Pages に公開するだけ。テストは PR で済ませているので、公開を待たせない
# 自動マージされた更新は push のきっかけにならない（GitHub の決まり）ため、1時間ごとにも見に行き、未公開の更新があれば公開する
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: true

jobs:
  # ===== PR のチェック =====
  # 画面の通しテストに使うブラウザは、Playwright 公式のイメージに入っているものを使う
  # （毎回 Ubuntu の配布サーバーから取ってくると、つながらずに10分ほど待たされて落ちることがあったため）。
  # イメージの版は package.json の @playwright/test にそろえる（Dependabot が上げてもずれない）
  playwright:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/^[^0-9]*/, '')")" >> "$GITHUB_OUTPUT"

  check:
    needs: playwright
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: 既知の脆弱性（深刻度 high 以上）がないか
        run: npm audit --audit-level=high
      - name: 型チェック・ビルド
        run: npm run build
      - name: ルールのテスト・シミュレーション・楽譜のテスト
        run: npm test
      - name: 画面の通しテスト（ブラウザ2つで、各モードを1ゲームずつ遊ぶ）
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  # ===== main の公開 =====
  # 定期実行のときだけ：公開中の版が main の最新と同じなら何もしない
  changed:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          site=https://chris949.github.io/tier-list-wars/
          js=$(curl -fsSL "$site" | grep -o 'assets/index-[^"]*\.js' | head -1 || true)
          if [ -n "$js" ] && curl -fsSL "$site$js" | grep -q "${SHA:0:7}"; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ビルド（型チェックを含む）
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
