<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ティアリストウォーズ</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"
  integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #e3f2fb; --dot: #cfe7f6; --card: #ffffff; --ink: #1f2d3d; --muted: #6b7c90; --line: #d5e4ef; --field: #f6fafd;
    --coral: #ff6f6f; --sun: #ffc83d; --mint: #36c99a; --sky: #4aa6f0;
    --hit: #e3f8ef; --miss: #ffecec; --miss-line: #ffb3b3;
    --round: "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro", "Zen Maru Gothic", "M PLUS Rounded 1c", "Arial Rounded MT Bold", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); font-family: var(--round); line-height: 1.5;
    background: var(--bg) radial-gradient(var(--dot) 2px, transparent 2.5px) 0 0 / 22px 22px; }
  #app { max-width: 560px; margin: 0 auto; padding: 16px 16px 64px; }
  #app.has-tray { padding-bottom: 280px; }
  .enter { animation: enter .3s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ロゴ */
  .logo { text-align: center; margin: 10px 0 2px; }
  .logo .bands { display: inline-flex; gap: 4px; margin-bottom: 6px; }
  .logo .bands span { width: 26px; height: 8px; border-radius: 4px; }
  h1 { margin: 0; font-size: 32px; line-height: 1.15; letter-spacing: .02em; color: #fff;
    -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  h1 .w { color: var(--sun); }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
  .bar h1 { font-size: 20px; -webkit-text-stroke: 5px var(--ink); text-shadow: 0 3px 0 var(--ink); }
  .sub { text-align: center; color: var(--muted); margin: 4px 0 18px; font-size: 14px; font-weight: 700; }

  .card { background: var(--card); border: 2.5px solid var(--ink); border-radius: 20px; padding: 16px;
    margin-bottom: 16px; box-shadow: 0 4px 0 var(--ink); }
  h2 { font-size: 17px; margin: 0 0 10px; }
  label.field { display: block; margin-bottom: 10px; color: var(--muted); font-size: 13px; font-weight: 700; }
  label.field input { margin-top: 6px; }
  input[type=text] { width: 100%; padding: 11px 14px; border-radius: 14px; border: 2px solid var(--line);
    background: var(--field); color: var(--ink); font: inherit; font-size: 16px; }
  input[type=text]:focus { outline: none; border-color: var(--sky); background: #fff; }
  input.code-input { text-align: center; font-weight: 800; letter-spacing: .25em; font-size: 20px; text-transform: uppercase; }
  input.code-input::placeholder { letter-spacing: normal; font-weight: 700; font-size: 15px; }

  button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 14px; border: 2.5px solid var(--ink);
    background: #fff; color: var(--ink); padding: 8px 14px; min-height: 44px; box-shadow: 0 3px 0 var(--ink);
    transition: transform .05s, box-shadow .05s; }
  button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--coral); color: #fff; font-weight: 800; font-size: 16px; min-height: 50px; padding: 10px 18px; box-shadow: 0 4px 0 var(--ink); }
  button.ghost { background: transparent; border-color: var(--line); box-shadow: none; color: var(--muted); }
  button.danger { color: var(--coral); }
  button.wide { width: 100%; }
  button.small { min-height: 36px; padding: 4px 12px; font-size: 13px; }
  button.mini { min-height: 32px; width: 32px; padding: 0; border: 2px solid var(--line); box-shadow: none; color: var(--muted); font-size: 11px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > input { flex: 1; }
  .stack > * + * { margin-top: 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .notice { margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: var(--miss); border: 2px solid var(--miss-line); font-weight: 700; font-size: 14px; }
  .count { display: inline-block; background: var(--sun); border: 2px solid var(--ink); border-radius: 999px;
    padding: 0 10px; font-size: 12px; font-weight: 800; margin-left: 6px; vertical-align: 2px; }

  /* お題 */
  .topic { display: flex; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 2px dashed var(--line); }
  .topic:last-of-type { border-bottom: 0; }
  .topic label { flex: 1; display: flex; gap: 8px; align-items: center; cursor: pointer; min-width: 0; }
  .topic b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topic input { width: 20px; height: 20px; flex: none; accent-color: var(--coral); }
  .opt-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .opt-row span { width: 22px; text-align: right; color: var(--muted); font-weight: 800; }
  .opt-row button { min-height: 40px; width: 40px; padding: 0; border-color: var(--line); box-shadow: none; color: var(--muted); }

  /* ロビー */
  .code { font-size: 38px; font-weight: 900; letter-spacing: .18em; color: var(--ink); margin: 2px 0 6px; }
  .players { display: flex; flex-wrap: wrap; gap: 6px; }
  .pl { background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 14px; font-weight: 700;
    display: flex; gap: 4px; align-items: center; }
  .pl.off { opacity: .4; }
  .pl.me { background: var(--sun); }
  .pl .sc { color: var(--coral); font-weight: 800; }
  .pl button.mini { width: 24px; min-height: 24px; border-radius: 50%; }

  /* 順位 */
  .badge { flex: none; width: 38px; height: 38px; border-radius: 12px; border: 2.5px solid var(--ink);
    display: grid; place-items: center; font-weight: 900; font-size: 17px; color: var(--ink); }
  .badge.hidden { background: #e9f1f7; color: #9fb3c4; border-color: #b9cfdf; }
  .slot { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; min-height: 42px; }
  .slot .item { flex: 1; text-align: left; min-height: 42px; padding: 0 14px; border-radius: 12px; border-width: 2px; box-shadow: none; }
  .slot .empty { flex: 1; min-height: 42px; border: 2px dashed #b9cfdf; border-radius: 12px; background: rgba(255,255,255,.5); }
  .ans { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .ans .txt { flex: 1; min-height: 42px; display: flex; align-items: center; padding: 0 14px; border-radius: 12px;
    border: 2px solid var(--ink); background: #fff; font-weight: 700; }
  .ans .txt.muted { color: #9fb3c4; border-color: #b9cfdf; background: rgba(255,255,255,.6); }

  /* 画面下に固定する選択肢トレイ */
  .tray { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: #fff; border-top: 3px solid var(--ink);
    border-radius: 22px 22px 0 0; box-shadow: 0 -6px 16px rgba(31,45,61,.12); }
  .tray-in { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); }
  .tray .hint { font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; max-height: 34vh; overflow: auto; padding-bottom: 4px; }
  .chip { border-radius: 999px; padding: 6px 14px; min-height: 40px; background: #eaf5fd; }

  /* 進行中の表示 */
  .status { display: inline-block; background: var(--sky); color: #fff; border: 2px solid var(--ink); border-radius: 999px;
    padding: 2px 12px; font-size: 12px; font-weight: 800; }
  .qtitle { font-size: 22px; font-weight: 800; margin: 6px 0 4px; line-height: 1.35; }
  .who { color: var(--coral); font-weight: 800; }
  .waiting { font-weight: 700; color: var(--muted); }
  .waiting b { color: var(--ink); }

  /* 答え合わせ */
  .focus { text-align: center; padding: 10px 0 6px; }
  .focus-rank { font-size: 26px; font-weight: 900; display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .focus-rank .badge { width: 46px; height: 46px; font-size: 22px; }
  .picks { margin-top: 12px; display: grid; gap: 6px; text-align: left; }
  .pick { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line); font-weight: 700; }
  .pick.hit { background: var(--hit); border-color: var(--mint); }
  .pick.miss { background: var(--miss); border-color: var(--miss-line); }
  .pick.me { border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .pick .mark { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 900; }
  .pick.hit .mark { background: var(--mint); }
  .pick.miss .mark { background: var(--coral); }
  .pick .opt { margin-left: auto; }
  .you { background: var(--sun); border: 2px solid var(--ink); border-radius: 999px; font-size: 11px; padding: 0 7px; }
  .guess-row { border-top: 2px dashed var(--line); padding: 10px 0; }
  .guess-row.me { background: #fff8e1; margin: 0 -16px; padding: 10px 16px; }
  .guess-row .head { display: flex; justify-content: space-between; margin-bottom: 6px; gap: 8px; }
  .pts { color: var(--coral); font-weight: 900; }
  .seq { display: flex; flex-wrap: wrap; gap: 4px; }
  .seq span { font-size: 12px; padding: 2px 8px; border-radius: 8px; border: 1.5px solid; font-weight: 700; }
  .seq .hit { background: var(--hit); border-color: var(--mint); }
  .seq .miss { background: var(--miss); border-color: var(--miss-line); }
  .rank-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 2px dashed var(--line); font-size: 18px; font-weight: 700; }
  .rank-row:last-child { border-bottom: 0; }
  .rank-row .n { width: 40px; font-size: 24px; text-align: center; }
  .rank-row .nm { flex: 1; }
  .pop { animation: pop .4s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  /* 制限時間 */
  .timer { display: inline-flex; align-items: center; gap: 2px; background: #fff; border: 2px solid var(--ink); border-radius: 999px;
    padding: 1px 12px; font-size: 14px; font-weight: 800; }
  .timer b { font-size: 18px; min-width: 1.4em; text-align: center; }
  .timer.warn { background: var(--coral); color: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .timeup { text-align: center; font-size: 30px; font-weight: 900; color: var(--coral); margin: 18px 0 4px; }

  /* ドラッグ＆ドロップ */
  .chip, .grip { touch-action: none; }
  .grip { display: inline-block; color: var(--muted); margin: -8px 8px -8px -6px; padding: 8px 4px; font-size: 18px; cursor: grab; }
  .dragging { opacity: .3; }
  .drag-ghost { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; margin: 0; box-shadow: 0 10px 20px rgba(31,45,61,.25) !important;
    background: #fff; border: 2.5px solid var(--ink); border-radius: 12px; min-height: 42px; padding: 0 14px; display: flex; align-items: center; font-weight: 700; }
  .slot.drop .item, .slot.drop .empty { outline: 3px dashed var(--coral); outline-offset: 2px; }

  /* 音・お知らせ */
  button.sound { width: 40px; padding: 0; font-size: 16px; }
  .banner { position: sticky; top: 8px; z-index: 20; background: var(--sun); border: 2.5px solid var(--ink); border-radius: 14px;
    padding: 8px 12px; margin-bottom: 12px; font-weight: 800; font-size: 14px; text-align: center; box-shadow: 0 3px 0 var(--ink); }
  #err { position: fixed; left: 12px; right: 12px; top: 12px; z-index: 100; background: var(--miss); border: 2.5px solid var(--coral);
    border-radius: 14px; padding: 10px 14px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 0 var(--ink); cursor: pointer; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; font-size: 14px; box-shadow: none; border-width: 2px; border-color: var(--line); color: var(--muted); }
  .seg button.on { background: var(--sky); border-color: var(--ink); color: #fff; box-shadow: 0 3px 0 var(--ink); }
  .stepper { justify-content: center; gap: 16px; }
  .stepper button { width: 48px; font-size: 22px; padding: 0; }
  .count-val { flex: none !important; font-size: 22px; font-weight: 900; min-width: 3em; text-align: center; }
  button { touch-action: manipulation; }
  details summary { cursor: pointer; font-weight: 800; }
  ol.rules { padding-left: 20px; margin: 10px 0 0; }
  ol.rules li { margin-bottom: 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== 設定 =====
const DEV = new URLSearchParams(location.search).has('dev'); // ?dev で最少2人から遊べる（動作確認用）
const MIN_PLAYERS = DEV ? 2 : 4, MAX_PLAYERS = 10, MIN_OPT = 5, MAX_OPT = 50;
const MIN_PICK = 5, MAX_PICK = 10; // 出題数（選択肢の中からランダムに出す数）
const PREFIX = 'tierlistwars-v1-';
const ROOM_CODE_LEN = 6;
const PERFECT_BONUS = 3;
const REVEAL_FIRST_MS = 2000, REVEAL_STEP_MS = 3000, REVEAL_SUSPENSE_MS = 2000; // めくりの間隔（暫定値）
const PICK_TIME_MS = 30000, PICK_GRACE_MS = 1500; // 並び替えの制限時間（暫定値）と、通信の遅れを見込んだ猶予
const HEARTBEAT_MS = 3000, DEAD_MS = 10000, GIVEUP_MS = 15000; // 接続の見張り：合図の間隔／切れたとみなす時間／再接続をあきらめる時間

// ===== 共通 =====
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = () => Math.random().toString(36).slice(2, 10);
const clean = (s, max) => String(s ?? '').trim().slice(0, max);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const TIER_COLORS = ['#ff6f6f', '#ff9f43', '#ffc83d', '#bde05a', '#36c99a', '#4ac3d6', '#4aa6f0'];
const tierColor = (r, n) => TIER_COLORS[n <= 1 ? 0 : Math.round((r / (n - 1)) * (TIER_COLORS.length - 1))];

// ===== 音（BGM と効果音をブラウザの中で合成する。音源ファイルは使わない） =====
const Sound = (() => {
  let ctx = null, bgmGain, seGain, noiseBuf, bgmTimer = null, nextTime = 0, step = 0;
  let mode = store.get('tlw-sound', 'all'); // all（BGM＋効果音） | se（効果音だけ） | off
  const midi = m => 440 * 2 ** ((m - 69) / 12);
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      bgmGain = ctx.createGain(); seGain = ctx.createGain();
      bgmGain.connect(ctx.destination); seGain.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    bgmGain.gain.value = mode === 'all' ? 0.05 : 0; // 通話の声を邪魔しない小さめの音量
    seGain.gain.value = mode === 'off' ? 0 : 0.2;
    if (mode === 'all') startBgm(); else stopBgm();
  }
  function tone(freq, t, dur, type, gain, dest = seGain) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
    return o;
  }
  function noise(t, dur, gain, dest = seGain, cutoff = 3000) {
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = cutoff;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest); src.start(t); src.stop(t + dur + 0.05);
  }
  // BGM：C–Am–F–G をくり返す軽いループ。少し先まで予約して鳴らす
  const EIGHTH = 60 / 112 / 2;
  const CHORDS = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];
  const ARP = [0, 1, 2, 1, 0, 1, 2, 1];
  function schedule() {
    while (nextTime < ctx.currentTime + 0.4) {
      const ch = CHORDS[Math.floor(step / 8) % 4], beat = step % 8;
      if (beat % 4 === 0) tone(midi(ch[0] - 24), nextTime, EIGHTH * 3.5, 'sine', 0.9, bgmGain);
      tone(midi(ch[ARP[beat]] + 12), nextTime, EIGHTH * 0.9, 'triangle', 0.3, bgmGain);
      if (beat % 2 === 1) noise(nextTime, 0.04, 0.12, bgmGain, 7000);
      nextTime += EIGHTH; step++;
    }
  }
  function startBgm() { if (bgmTimer) return; nextTime = ctx.currentTime + 0.1; bgmTimer = setInterval(schedule, 120); }
  function stopBgm() { clearInterval(bgmTimer); bgmTimer = null; }
  const SFX = {
    click: t => tone(880, t, 0.08, 'sine', 0.5),
    start: t => [67, 72].forEach((m, i) => tone(midi(m), t + i * 0.1, 0.15, 'triangle', 0.6)),
    pop: t => tone(520, t, 0.2, 'triangle', 0.8).frequency.exponentialRampToValueAtTime(1040, t + 0.12),
    tick: t => tone(1320, t, 0.05, 'square', 0.2),
    drumroll: t => { for (let i = 0; i < 26; i++) noise(t + i * 0.07, 0.06, 0.25 + i * 0.02, seGain, 1200); },
    fanfare: t => [72, 76, 79, 84].forEach((m, i) => tone(midi(m), t + i * 0.11, i === 3 ? 0.7 : 0.16, 'triangle', 0.7)),
    perfect: t => [84, 88, 91, 96, 91, 96].forEach((m, i) => tone(midi(m), t + i * 0.07, 0.14, 'sine', 0.45)),
  };
  return {
    ensure,
    get mode() { return mode; },
    cycle() { mode = mode === 'all' ? 'se' : mode === 'se' ? 'off' : 'all'; store.set('tlw-sound', mode); ensure(); },
    play(name, delay = 0) { if (ctx && mode !== 'off' && ctx.state === 'running') SFX[name]?.(ctx.currentTime + 0.02 + delay); },
  };
})();
// ブラウザの決まりで、最初に画面に触れるまでは音を出せない
document.addEventListener('pointerdown', () => Sound.ensure(), true);
document.addEventListener('keydown', () => Sound.ensure(), true);
const SOUND_ICON = { all: '🔊', se: '🔔', off: '🔇' };
const SOUND_LABEL = { all: 'BGM＋効果音', se: '効果音だけ', off: '音なし' };
const soundBtn = () => `<button class="small sound" data-act="sound" title="${SOUND_LABEL[Sound.mode]}（押すと切り替え）">${SOUND_ICON[Sound.mode]}</button>`;

// 状態が変わったときの効果音
function playStateSounds(prev, next) {
  const turn = x => x && `${x.phase}-${x.gameNo}-${x.round}`;
  if ((next.phase === 'ranking' || next.phase === 'guess') && turn(prev) !== turn(next)) Sound.play('start');
  const r = next.reveal;
  if (!r) return;
  const pr = prev?.phase === 'reveal' && prev.round === next.round ? prev.reveal : null;
  if (r.suspense && !pr?.suspense) Sound.play('drumroll');
  if (r.shown > (pr?.shown ?? 0)) Sound.play(r.shown >= r.answer.length ? 'fanfare' : 'pop');
  if (r.done && !pr?.done && r.rows.some(row => row.hits === r.answer.length)) Sound.play('perfect', 0.8);
}

// タブごとに別プレイヤーとして扱う（リロードしても同じ人として復帰できる）
// myId は他の参加者にも見えるので、なりすまし防止に本人だけが知る myKey を併せて送る
const session = {
  get(k, make) { try { const v = sessionStorage.getItem(k) || make(); sessionStorage.setItem(k, v); return v; } catch { return make(); } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
};
const myId = session.get('tlw-id', () => uid() + uid());
const myKey = session.get('tlw-key', () => uid() + uid() + uid());
let lastRoom = session.get('tlw-room', () => ''); // 切断後に同じ部屋へ入り直しやすくする

let myName = store.get('tlw-name', '');
// 初回のサンプル。全員がサンプルのままでも10人まで遊べるよう10個用意する（同じお題は1つにまとめて配るため）
const SAMPLE_TOPICS = [
  ['好きな野菜は？', ['じゃがいも', 'にんじん', 'たまねぎ', 'キャベツ', 'トマト']],
  ['行ってみたい国は？', ['イタリア', 'アメリカ', '韓国', 'タイ', 'フランス', 'オーストラリア']],
  ['好きなおにぎりの具は？', ['鮭', '梅', 'ツナマヨ', '昆布', 'おかか', '明太子']],
  ['無人島に持っていくなら？', ['ナイフ', 'ライター', 'スマホ', '本', 'テント', '釣り竿', '水']],
  ['好きな季節のイベントは？', ['お花見', '夏祭り', '花火大会', 'ハロウィン', 'クリスマス', '年越し']],
  ['休日の過ごし方、好きな順は？', ['寝る', '外食', 'ゲーム', '買い物', '映画', '旅行']],
  ['好きなコンビニスイーツは？', ['プリン', 'シュークリーム', 'ロールケーキ', 'エクレア', 'チーズケーキ']],
  ['もらって嬉しいプレゼントは？', ['現金', '手紙', 'お花', 'ギフト券', '手作りのもの', '高級なお菓子']],
  ['好きな麺類は？', ['ラーメン', 'うどん', 'そば', 'パスタ', '焼きそば', '冷やし中華']],
  ['住むならどこがいい？', ['都会のど真ん中', '海の近く', '山の中', '雪国', '南の島']],
];
let topics = store.get('tlw-topics', null) ?? SAMPLE_TOPICS.map(([title, options]) => ({ id: uid(), title, options, bring: true }));
const saveTopics = () => store.set('tlw-topics', topics);
// 出題数の既定値：v0.5 以前のお題とサンプルは、選択肢の数（最大10）をそのまま出す
const pickCount = t => Math.max(MIN_PICK, Math.min(MAX_PICK, t.options.length, Math.trunc(t.count) || t.options.length));
const broughtTopics = () => topics.filter(t => t.bring).map(t => ({ title: t.title, options: t.options, count: pickCount(t) }));

// ===== 画面状態 =====
let view = 'home';           // home | topics | edit | room
let editing = null;          // 編集中のお題
let notice = '';
let net = { peer: null, conn: null, isHost: false, code: '' };
let pub = null;              // ホストから届いた自分向けの状態
// 並び替え中の枠。slots[順位] = 選択肢の番号（空きは null）
let picker = { key: '', slots: [] };
const pickerFull = () => picker.slots.length > 0 && picker.slots.every(v => v != null);
// 枠 t に item を入れる。埋まっていれば下（なければ上）の空きまで1つずつずらす
function putInSlot(item, t) {
  const sl = picker.slots;
  if (sl[t] == null) { sl[t] = item; return; }
  let gap = sl.indexOf(null, t);
  if (gap >= 0) { for (let i = gap; i > t; i--) sl[i] = sl[i - 1]; }
  else { gap = sl.lastIndexOf(null, t); for (let i = gap; i < t; i++) sl[i] = sl[i + 1]; }
  sl[t] = item;
}
let connecting = false;
let pending = null, pendingTimer = null; // 送信してホストの受け取りを待っている並び替え
let reconnectSince = 0;                  // 自動再接続を始めた時刻（0 = 再接続中ではない）

// ===== ホスト側のゲーム進行 =====
let G = null;
const conns = {};

const PICK_MODES = { random: '全部からランダム', each: '作成者ごとに1つずつ' };
function newGame(gameNo = 1, players = [], mode = 'random') {
  return { gameNo, mode, phase: 'lobby', players, topicsBy: {}, assign: {}, ranks: {}, order: [], round: 0, guesses: {}, reveal: null, deadline: 0 };
}
const online = () => G.players.filter(p => p.online);
const nameOf = id => G.players.find(p => p.id === id)?.name ?? '???';
const currentTarget = () => (G.phase === 'guess' || G.phase === 'reveal') ? G.order[G.round] : null;

function sanitizeTopics(list) {
  if (!Array.isArray(list)) return [];
  return list.slice(0, 50).map(t => {
    const options = Array.isArray(t?.options) ? [...new Set(t.options.map(o => clean(o, 40)).filter(Boolean))].slice(0, MAX_OPT) : [];
    return { title: clean(t?.title, 60), options, count: pickCount({ options, count: t?.count }) };
  }).filter(t => t.title && t.options.length >= MIN_OPT);
}
const validOrder = (o, n) => Array.isArray(o) && o.length === n && new Set(o).size === n && o.every(i => Number.isInteger(i) && i >= 0 && i < n);

// 持ち込まれたお題をまとめる。お題名と選択肢（順不同）が同じものは1つにし、先に入った人を作成者にする
// 手を加えていないサンプルは、作成者を「サンプル」とする
const topicKey = (title, options) => JSON.stringify([title, [...options].sort()]);
const SAMPLE_KEYS = new Set(SAMPLE_TOPICS.map(([title, options]) => topicKey(title, options)));
function topicPool(players) {
  const seen = new Set();
  return players.flatMap(p => (G.topicsBy[p.id] ?? []).map(t => SAMPLE_KEYS.has(topicKey(t.title, t.options))
      ? { ...t, authorId: null, authorName: 'サンプル' }
      : { ...t, authorId: p.id, authorName: p.name }))
    .filter(t => {
      const key = topicKey(t.title, t.options);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
}

function canStart() {
  const n = online().length;
  if (n < MIN_PLAYERS) return `あと${MIN_PLAYERS - n}人必要です（${MIN_PLAYERS}〜${MAX_PLAYERS}人）`;
  const total = topicPool(online()).length;
  if (total < n) return `お題が足りません（同じお題は1つにまとめて${total}個 / ${n}人分必要）。誰かがお題を作ってから入り直してください`;
  return null;
}

function startGame() {
  const players = online();
  const pool = topicPool(players);
  // 自作のお題を優先して配り、足りない分をサンプルで補う（柱3）
  const custom = shuffle(pool.filter(t => t.authorId)), samples = pool.filter(t => !t.authorId);
  // 「作成者ごとに1つずつ」なら、自作のお題を持ってきた人から1つずつ先に選ぶ
  const first = G.mode === 'each' ? custom.filter((t, i) => custom.findIndex(x => x.authorId === t.authorId) === i) : [];
  const rest = custom.filter(t => !first.includes(t));
  const chosen = [...shuffle(first), ...rest, ...shuffle(samples)].slice(0, players.length);
  // 自分が作ったお題がなるべく自分に当たらない割り振りを探す
  let best = null, bestOwn = Infinity;
  for (let i = 0; i < 300 && bestOwn > 0; i++) {
    const pick = shuffle(chosen);
    const own = pick.filter((t, k) => t.authorId === players[k].id).length;
    if (own < bestOwn) { best = pick; bestOwn = own; }
  }
  // 配ったお題ごとに、選択肢から出題数だけランダムに選ぶ（並びもシャッフル）
  G.assign = {};
  players.forEach((p, k) => {
    const t = best[k];
    G.assign[p.id] = { title: t.title, options: shuffle(t.options).slice(0, t.count), authorId: t.authorId, authorName: t.authorName };
  });
  G.players.forEach(p => { p.score = 0; });
  G.ranks = {}; G.guesses = {}; G.reveal = null;
  G.phase = 'ranking';
  startPickTimer();
}

// 並び替えの制限時間。ホストが管理し、締め切りの少しあとで締める（時間切れの人は未提出扱い）
let pickTimer = null;
function startPickTimer() {
  clearTimeout(pickTimer);
  G.deadline = Date.now() + PICK_TIME_MS;
  pickTimer = setTimeout(() => {
    if (!G) return;
    if (G.phase === 'ranking') toGuess();
    else if (G.phase === 'guess') toReveal();
    else return;
    broadcast();
  }, PICK_TIME_MS + PICK_GRACE_MS);
}
function stopPickTimer() { clearTimeout(pickTimer); pickTimer = null; if (G) G.deadline = 0; }

function toGuess() {
  G.order = shuffle(G.players.filter(p => G.ranks[p.id]).map(p => p.id));
  G.round = 0; G.guesses = {};
  G.phase = G.order.length ? 'guess' : 'result';
  if (G.phase === 'guess') startPickTimer(); else stopPickTimer();
}

// 答え合わせ：最下位から1位へ自動でめくる。shown = めくり済みの数（下から数える）
function toReveal() {
  const tgt = currentTarget();
  const answer = G.ranks[tgt];
  const rows = G.players.filter(p => G.guesses[p.id]).map(p => {
    const order = G.guesses[p.id];
    const hits = order.filter((v, i) => v === answer[i]).length;
    const pts = hits + (hits === answer.length ? PERFECT_BONUS : 0);
    return { id: p.id, name: p.name, order, hits, pts };
  });
  const timeouts = G.players.filter(p => p.id !== tgt && p.online && !G.guesses[p.id]).map(p => p.name);
  G.reveal = { answer, rows, timeouts, shown: 0, suspense: false, done: false };
  G.phase = 'reveal';
  stopPickTimer();
  scheduleReveal(REVEAL_FIRST_MS);
}

let revealTimer = null;
function stopRevealTimer() { clearTimeout(revealTimer); revealTimer = null; }
function scheduleReveal(ms) { stopRevealTimer(); revealTimer = setTimeout(stepReveal, ms); }

function stepReveal() {
  const r = G?.phase === 'reveal' ? G.reveal : null;
  if (!r || r.done) return;
  const n = r.answer.length;
  if (r.shown === n - 1 && !r.suspense) {
    r.suspense = true; // 「1位は…」で溜める
    scheduleReveal(REVEAL_SUSPENSE_MS);
  } else {
    r.suspense = false;
    r.shown++;
    if (r.shown >= n) finishReveal();
    else scheduleReveal(REVEAL_STEP_MS);
  }
  broadcast();
}

// 全部めくり終わった時点で得点を加算する
function finishReveal() {
  stopRevealTimer();
  const r = G.reveal;
  r.shown = r.answer.length; r.suspense = false;
  if (r.done) return;
  r.done = true;
  for (const row of r.rows) {
    const p = G.players.find(x => x.id === row.id);
    if (p) p.score += row.pts;
  }
}

function checkAdvance() {
  if (G.phase === 'ranking' && online().every(p => G.ranks[p.id])) toGuess();
  else if (G.phase === 'guess') {
    const tgt = currentTarget();
    if (online().filter(p => p.id !== tgt).every(p => G.guesses[p.id])) toReveal();
  }
}

function reject(conn, msg) {
  if (!conn) { leaveRoom(msg); return; }
  conn.send({ t: 'error', msg });
  setTimeout(() => conn.close(), 500);
}

function hostHandle(pid, msg, conn) {
  if (!msg || typeof msg !== 'object') return;
  const isHostMe = pid === myId;
  switch (msg.t) {
    case 'join': {
      const name = clean(msg.name, 16) || '名無し';
      const tps = sanitizeTopics(msg.topics);
      let p = G.players.find(x => x.id === pid);
      if (!p) {
        if (G.phase !== 'lobby') return reject(conn, 'ゲーム進行中のため参加できません');
        if (G.players.length >= MAX_PLAYERS) return reject(conn, `満員です（最大${MAX_PLAYERS}人）`);
        if (!tps.length) return reject(conn, 'お題を1つ以上持ってきてください');
        p = { id: pid, key: clean(msg.key, 64), name, score: 0 };
        G.players.push(p);
      }
      p.name = name; p.online = true;
      if (G.phase === 'lobby' && tps.length) G.topicsBy[pid] = tps;
      break;
    }
    case 'rank':
      if (G.phase !== 'ranking' || !G.assign[pid] || !validOrder(msg.order, G.assign[pid].options.length)) return;
      G.ranks[pid] = msg.order;
      checkAdvance();
      break;
    case 'guess': {
      const tgt = currentTarget();
      if (G.phase !== 'guess' || msg.round !== G.round || pid === tgt || !validOrder(msg.order, G.assign[tgt].options.length)) return;
      G.guesses[pid] = msg.order;
      checkAdvance();
      break;
    }
    case 'mode':
      if (!isHostMe || G.phase !== 'lobby' || !PICK_MODES[msg.mode]) return;
      G.mode = msg.mode;
      break;
    case 'start':
      if (!isHostMe || G.phase !== 'lobby' || canStart()) return;
      startGame();
      break;
    case 'force':
      if (!isHostMe) return;
      if (G.phase === 'ranking') toGuess();
      else if (G.phase === 'guess') toReveal();
      break;
    case 'reveal-all':
      if (G.phase !== 'reveal' || G.reveal.done || (!isHostMe && pid !== currentTarget())) return;
      finishReveal();
      break;
    case 'next':
      if (!isHostMe || G.phase !== 'reveal' || !G.reveal.done) return;
      G.round++; G.guesses = {}; G.reveal = null;
      G.phase = G.round < G.order.length ? 'guess' : 'result';
      if (G.phase === 'guess') startPickTimer();
      break;
    case 'lobby': {
      if (!isHostMe || G.phase !== 'result') return;
      const keep = online().map(p => ({ ...p, score: 0 }));
      const topicsBy = G.topicsBy;
      G = newGame(G.gameNo + 1, keep, G.mode);
      keep.forEach(p => { G.topicsBy[p.id] = topicsBy[p.id] ?? []; });
      break;
    }
    case 'kick': {
      if (!isHostMe || G.phase !== 'lobby' || msg.id === myId) return;
      conns[msg.id]?.send({ t: 'error', msg: 'ホストに退出させられました' });
      setTimeout(() => conns[msg.id]?.close(), 300);
      hostLeave(msg.id);
      return;
    }
    default: return;
  }
  broadcast();
}

function hostLeave(pid) {
  const p = G.players.find(x => x.id === pid);
  if (!p) return;
  if (G.phase === 'lobby') {
    G.players = G.players.filter(x => x.id !== pid);
    delete G.topicsBy[pid];
  } else {
    p.online = false;
    checkAdvance();
  }
  broadcast();
}

function viewFor(id) {
  const tgt = currentTarget();
  return {
    phase: G.phase, gameNo: G.gameNo, mode: G.mode, code: net.code, hostId: myId, me: id,
    players: G.players.map(p => ({
      id: p.id, name: p.name, score: p.score, online: p.online !== false,
      topics: G.topicsBy[p.id]?.length ?? 0,
      done: G.phase === 'ranking' ? !!G.ranks[p.id] : G.phase === 'guess' && p.id !== tgt ? !!G.guesses[p.id] : null,
    })),
    startError: G.phase === 'lobby' ? canStart() : null,
    timeLeft: (G.phase === 'ranking' || G.phase === 'guess') && G.deadline ? Math.max(0, G.deadline - Date.now()) : null,
    myTopic: G.assign[id] ?? null,
    myRank: G.ranks[id] ?? null,
    round: G.round, rounds: G.order.length,
    target: tgt ? { id: tgt, name: nameOf(tgt), topic: G.assign[tgt] } : null,
    myGuess: G.guesses[id] ?? null,
    reveal: G.phase === 'reveal' ? G.reveal : null,
  };
}

function broadcast() {
  for (const p of G.players) {
    const v = viewFor(p.id);
    if (p.id === myId) setPub(v);
    else if (conns[p.id]?.open) conns[p.id].send({ t: 'state', state: v });
  }
}

// ===== 通信（PeerJS / WebRTC。シグナリングだけ公開ブローカーを使い、ゲームの通信は端末同士で直接） =====
function needPeer() {
  if (typeof Peer === 'undefined') { notice = 'PeerJS の読み込みに失敗しました。ネット接続を確認してください。'; render(); return false; }
  if (!myName.trim()) { notice = '名前を入力してください'; render(); return false; }
  if (!broughtTopics().length) { notice = 'お題を1つ以上「持っていく」にチェックしてください'; render(); return false; }
  return true;
}

function genCode() {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({ length: ROOM_CODE_LEN }, () => c[Math.floor(Math.random() * c.length)]).join('');
}

function hostRoom() {
  if (!needPeer()) return;
  connecting = true; notice = ''; render();
  const code = genCode();
  const peer = new Peer(PREFIX + code, { debug: 0 });
  peer.on('open', () => {
    connecting = false;
    net = { peer, conn: null, isHost: true, code, hb: setInterval(hostHeartbeat, HEARTBEAT_MS) };
    G = newGame();
    view = 'room';
    hostHandle(myId, { t: 'join', name: myName, topics: broughtTopics() });
  });
  peer.on('connection', conn => {
    conn.lastSeen = Date.now();
    conn.on('data', msg => {
      conn.lastSeen = Date.now();
      if (msg?.t === 'join' && !conn.pid) {
        const pid = String(msg.id ?? '').replace(/[^A-Za-z0-9]/g, '').slice(0, 64); // 画面に出すので英数字のみ
        if (!pid || pid === myId) return conn.close();
        // 既にいる人のIDで来たら、本人の鍵を持っているときだけ入れ替える（なりすましで本人を追い出させない）
        const existing = G.players.find(x => x.id === pid);
        if (existing && existing.key !== clean(msg.key, 64)) return reject(conn, 'この参加者は既に部屋にいます');
        conn.pid = pid;
        if (conns[pid] && conns[pid] !== conn) { const old = conns[pid]; delete conns[pid]; old.close(); }
        conns[pid] = conn;
      }
      if (conn.pid && conns[conn.pid] === conn) hostHandle(conn.pid, msg, conn);
    });
    const gone = () => { if (conn.pid && conns[conn.pid] === conn) { delete conns[conn.pid]; hostLeave(conn.pid); } };
    conn.on('close', gone);
    conn.on('error', gone);
    conn.gone = gone;
  });
  peer.on('disconnected', () => { if (!peer.destroyed) peer.reconnect(); }); // ブローカーが切れても既存の接続は生きている
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { peer.destroy(); hostRoom(); return; }
    if (view !== 'room') { peer.destroy(); connecting = false; notice = '部屋を作れませんでした: ' + e.type; render(); }
  });
}

// ホスト：3秒ごとに合図を送り、10秒何も届かない参加者は切れたとみなす
// （スマホでブラウザが裏に回ると、切れても close が届かないことがあるため）
function hostHeartbeat() {
  for (const conn of Object.values(conns)) {
    if (Date.now() - conn.lastSeen > DEAD_MS) { conn.gone(); try { conn.close(); } catch {} }
    else if (conn.open) conn.send({ t: 'ping' });
  }
}

function joinRoom(code) {
  if (!needPeer()) return;
  code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== ROOM_CODE_LEN) { notice = `部屋コード（${ROOM_CODE_LEN}文字）を入力してください`; render(); return; }
  connecting = true; notice = ''; reconnectSince = 0; render();
  connectGuest(code);
}

// 参加者：ホストにつなぐ。初回の参加にも、切れたあとの自動再接続にも使う
function connectGuest(code) {
  const peer = new Peer({ debug: 0 });
  net = { peer, conn: null, isHost: false, code, lastSeen: Date.now(), joined: false };
  const mine = () => net.peer === peer;
  const fail = msg => {
    if (!mine()) return;
    if (reconnectSince) retryReconnect(code);
    else leaveRoom(msg);
  };
  const timer = setTimeout(() => { if (mine() && !net.joined) fail('接続できませんでした。コードを確認してください'); }, GIVEUP_MS);
  peer.on('open', () => {
    if (!mine()) return;
    const conn = peer.connect(PREFIX + code, { reliable: true });
    net.conn = conn;
    conn.on('open', () => conn.send({ t: 'join', id: myId, key: myKey, name: myName, topics: broughtTopics() }));
    conn.on('data', m => {
      if (!mine()) return;
      net.lastSeen = Date.now();
      if (m?.t === 'ping') conn.send({ t: 'pong' });
      else if (m?.t === 'state') {
        clearTimeout(timer);
        const wasReconnecting = reconnectSince;
        net.joined = true; reconnectSince = 0; connecting = false; view = 'room';
        lastRoom = code; session.set('tlw-room', code);
        setPub(normalizeState(m.state));
        if (wasReconnecting && pending) sendPending(); // 切れている間に送れなかった並び替えを送り直す
      }
      else if (m?.t === 'error') { clearTimeout(timer); reconnectSince = 0; leaveRoom(m.msg); }
    });
    conn.on('close', () => { if (mine()) startReconnect(); });
  });
  peer.on('error', e => {
    clearTimeout(timer);
    fail(e.type === 'peer-unavailable' ? '部屋が見つかりません' : '接続エラー: ' + e.type);
  });
}

// 切れたら、ホームに戻さず同じ人として入り直す。GIVEUP_MS たってもだめならホームへ
function startReconnect() {
  if (net.isHost || !net.joined || reconnectSince) return;
  reconnectSince = Date.now();
  const { peer, code } = net;
  net.peer = null; // 古い接続からの通知を無視する
  try { peer?.destroy(); } catch {}
  render();
  connectGuest(code);
}
function retryReconnect(code) {
  const { peer } = net;
  net.peer = null;
  try { peer?.destroy(); } catch {}
  if (Date.now() - reconnectSince > GIVEUP_MS) {
    reconnectSince = 0;
    leaveRoom('ホストとの接続が切れました。部屋が残っていれば、同じタブで「参加」を押すとゲーム中でも復帰できます');
    return;
  }
  setTimeout(() => { if (reconnectSince) connectGuest(code); }, 1500);
}

// 参加者：ホストから10秒何も届かなければ再接続する。ブラウザに戻ってきたときは早めに確かめる
setInterval(() => {
  if (!net.isHost && net.joined && !reconnectSince && Date.now() - net.lastSeen > DEAD_MS) startReconnect();
}, 2000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !net.isHost && net.joined && !reconnectSince && Date.now() - net.lastSeen > HEARTBEAT_MS + 1500) startReconnect();
});

// ホストから届いた状態の数値を数値に揃える（文字列は表示時に esc する）
function normalizeState(s) {
  const int = v => Number.isFinite(+v) ? Math.trunc(+v) : 0;
  const ints = a => Array.isArray(a) ? a.map(int) : [];
  s.round = int(s.round); s.rounds = int(s.rounds); s.gameNo = int(s.gameNo);
  s.code = String(s.code ?? '');
  s.timeLeft = s.timeLeft == null ? null : int(s.timeLeft);
  s.players = (s.players ?? []).map(p => ({ ...p, id: String(p.id ?? ''), score: int(p.score), topics: int(p.topics) }));
  for (const k of ['myRank', 'myGuess']) if (s[k]) s[k] = ints(s[k]);
  if (s.reveal) {
    s.reveal.shown = int(s.reveal.shown);
    s.reveal.answer = ints(s.reveal.answer);
    s.reveal.rows = (s.reveal.rows ?? []).map(r => ({ ...r, hits: int(r.hits), pts: int(r.pts), order: ints(r.order) }));
    s.reveal.timeouts = Array.isArray(s.reveal.timeouts) ? s.reveal.timeouts.map(String) : [];
  }
  return s;
}

// 自分向けの状態を受け取ったとき（ホスト自身も通る）。締め切りを自分の時計に直し、効果音と送信待ちを片付ける
function setPub(next) {
  const prev = pub;
  next.localDeadline = next.timeLeft != null ? Date.now() + next.timeLeft : 0;
  pub = next;
  if (pending) {
    const moved = pending.key !== `${next.phase}-${next.gameNo}-${next.round}`;
    if (moved || (pending.t === 'rank' && next.myRank) || (pending.t === 'guess' && next.myGuess)) { pending = null; clearTimeout(pendingTimer); }
  }
  playStateSounds(prev, next);
  render();
}

function leaveRoom(msg = '') {
  const peer = net.peer;
  clearInterval(net.hb);
  net = { peer: null, conn: null, isHost: false, code: '' };
  try { peer?.destroy(); } catch {}
  for (const k in conns) delete conns[k];
  stopRevealTimer(); clearTimeout(pickTimer);
  G = null; pub = null; connecting = false; pending = null; reconnectSince = 0;
  view = 'home'; notice = msg;
  render();
}

function send(msg) {
  if (net.isHost) hostHandle(myId, msg, null);
  else if (net.conn?.open) net.conn.send(msg);
}

// 並び替えを送る。ホストの受け取り（状態の更新）が3秒来なければ送り直し、それでもだめなら再接続する
function submitPick() {
  if (!pub || pending) return;
  const order = [...picker.slots];
  if (pub.phase === 'ranking') pending = { t: 'rank', order };
  else if (pub.phase === 'guess') pending = { t: 'guess', round: pub.round, order };
  else return;
  pending.key = `${pub.phase}-${pub.gameNo}-${pub.round}`;
  pending.tries = 0;
  Sound.play('click');
  render();
  sendPending();
}
function sendPending() {
  if (!pending) return;
  const { key, tries, ...msg } = pending;
  pending.tries++;
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(() => {
    if (!pending) return;
    if (pending.tries >= 2) startReconnect(); else sendPending();
  }, 3000);
  send(msg);
}

  let html;
  if (view === 'edit') html = renderEdit();

  else html = renderHome();
  // 画面（フェーズ）が変わったときだけ入場の動きを付ける。同じ画面の更新では動かさない
  const screen = view === 'room' && pub ? `room-${pub.phase}-${pub.round}` : view;
  app.innerHTML = screen !== lastScreen ? `<div class="enter">${html}</div>` : html;
  if (screen !== lastScreen) window.scrollTo(0, 0);
  lastScreen = screen;
  app.classList.toggle('has-tray', !!app.querySelector('.tray'));
}

function pickerHTML(options, key) {
  if (picker.key !== key || picker.slots.length !== options.length) picker = { key, slots: Array(options.length).fill(null) };

  if (!pending && timeIsUp()) return `<div class="timeup pop">時間切れ！</div><p class="muted small" style="text-align:center">今回は未提出です</p>`;
  const done = left === 0;
  const btn = pending ? '送信中…' : done ? 'この順位で決定' : `あと${left}つ並べると決定できます`;
  return `
    <p class="muted small">画面下の選択肢をタップ、またはつかんで順位の枠へ。並べた項目は ⠿ をつかむか ▲▼ で入れ替え、タップで戻せます。</p>
    ${options.map((_, r) => {
      const idx = slots[r];
      return `<div class="slot" data-slot="${r}"><span class="badge" style="background:${tierColor(r, n)}">${r + 1}</span>
        ${idx != null ? `<button class="item" data-act="unplace" data-r="${r}" data-drag="placed"><span class="grip" aria-hidden="true">⠿</span>${esc(options[idx])}</button>

      <div class="hint">${done ? '並べ終わりました。⠿ や ▲▼ で入れ替えもできます' : `${nextEmpty + 1}位に入れるものをタップ（残り${left}つ）`}</div>
      ${pool.length ? `<div class="pool">${pool.map(i => `<button class="chip" data-act="place" data-i="${i}" data-drag="pool">${esc(options[i])}</button>`).join('')}</div>` : ''}
      <button class="primary wide" data-act="submit-pick" ${!done || pending ? 'disabled' : ''}>${btn}</button>
    </div></div>`;
}

// 制限時間
const timeLeftMs = () => pub?.localDeadline ? pub.localDeadline - Date.now() : Infinity;
const timeIsUp = () => timeLeftMs() <= 0;
function timerHTML() {
  if (!pub?.localDeadline) return '';
  const sec = Math.max(0, Math.ceil(timeLeftMs() / 1000));
  return `<span class="timer ${sec <= 5 ? 'warn' : ''}">⏱ <b id="timer">${sec}</b>秒</span>`;
}
// 自分がまだ並べる必要があるか
function needsToPick() {
  if (!pub) return false;
  if (pub.phase === 'ranking') return !!pub.myTopic && !pub.myRank;
  if (pub.phase === 'guess') return pub.target?.id !== pub.me && !pub.myGuess;
  return false;
}
let shownSec = null;
setInterval(() => {
  const el = document.getElementById('timer');
  if (!el || !pub?.localDeadline) { shownSec = null; return; }
  const sec = Math.max(0, Math.ceil(timeLeftMs() / 1000));
  if (sec === shownSec) return;
  shownSec = sec;
  el.textContent = sec;
  el.parentElement.classList.toggle('warn', sec <= 5);
  if (sec > 0 && sec <= 5 && needsToPick() && !pending) Sound.play('tick');
  if (sec === 0) {
    // 並べ終えていれば、決定を押していなくても提出する。並べ終えていなければ未提出
    if (needsToPick() && !pending && pickerFull()) submitPick();
    else if (!drag) render();
  }
}, 200);

function orderHTML(options, order) {
  return order.map((idx, r) => `<div class="ans"><span class="badge" style="background:${tierColor(r, order.length)}">${r + 1}</span><span class="txt">${esc(options[idx])}</span></div>`).join('');
}

function waitingHTML(s, label) {

  const left = ps.filter(p => !p.done).map(p => `<b>${esc(p.name)}</b>さん`).join('、');
  return `<p class="waiting">${label}（${done}/${ps.length}）${left ? `<br>${left}を待っています` : ''}</p>
    ${net.isHost ? '<button data-act="force" class="small">未提出の人を待たずに進める</button>' : ''}`;
}

function standingsHTML(s) {

          <div class="head"><b>${esc(row.name)}${row.id === s.me ? '（あなた）' : ''}</b>
            <span><span class="muted small">${row.hits}/${r.answer.length}一致${row.hits === r.answer.length ? ' 🎯パーフェクト！' : ''}</span> <span class="pts">+${row.pts}</span></span></div>
          <div class="seq">${row.order.map((idx, i) => `<span class="${idx === r.answer[i] ? 'hit' : 'miss'}">${i + 1}. ${esc(t.options[idx])}</span>`).join('')}</div>
        </div>`).join('') : '<p class="muted">予想した人がいませんでした</p>'}
      <div style="margin-top:14px">
        ${net.isHost ? `<button class="primary wide" data-act="next">${s.round + 1 < s.rounds ? '次のラウンドへ' : '結果発表へ'}</button>`
          : '<p class="muted">ホストが次へ進めるのを待っています…</p>'}
      </div>
    </section>
    ${s.round + 1 < s.rounds ? `<section class="card"><h2>現在のランキング</h2>${standingsHTML(s)}</section>` : ''}` : ''}`;
  } else if (s.phase === 'result') {
    body = `<section class="card">
      <h2>最終結果</h2>
      ${standingsHTML(s)}
      <div style="margin-top:16px">
        ${net.isHost ? '<button class="primary wide" data-act="lobby">ロビーに戻る</button>' : '<p class="muted">ホストがロビーに戻すのを待っています…</p>'}
      </div>
    </section>`;
  }
  return `
  ${TITLE_BAR('<button class="small" data-act="leave">退出</button>')}
  ${s.phase !== 'lobby' ? `<section class="card">${playersHTML(s)}</section>` : ''}
  ${body}`;
}

// ===== 入力 =====
app.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'name') { myName = el.value; store.set('tlw-name', myName); }
  else if (el.id === 'e-title') editing.title = el.value;
  else if (el.dataset.opt != null) editing.options[+el.dataset.opt] = el.value;
});

app.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return; // 日本語の変換確定の Enter は無視
  const el = e.target;
  if (el.id === 'code') joinRoom(el.value);
  // お題の編集：Enter で次の欄へ。最後の欄なら（10個未満のとき）欄を足して移る
  else if (el.id === 'e-title' || el.dataset.opt != null) {
    e.preventDefault();
    const next = el.id === 'e-title' ? 0 : +el.dataset.opt + 1;
    if (next >= editing.options.length) {
      if (editing.options.length >= MAX_OPT) return;
      editing.options.push(''); render();
    }
    app.querySelector(`[data-opt="${next}"]`)?.focus();
  }
});

app.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; return; } // ドラッグの直後のクリックは無視
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  const r = +el.dataset.r;
  switch (act) {
    // ホーム
    case 'bring': {
      const t = topics.find(x => x.id === id);
      if (t) { t.bring = el.checked; saveTopics(); render(); }
      return;
    }
    case 'new': editing = { id: null, title: '', options: Array(MIN_OPT).fill(''), count: MIN_PICK }; notice = ''; view = 'edit'; break;
    case 'edit': {
      const t = topics.find(x => x.id === id);
      editing = { id, title: t.title, options: [...t.options], count: pickCount(t) }; notice = ''; view = 'edit'; break;
    }
    case 'del': {
      const t = topics.find(x => x.id === id);
      if (t && confirm(`「${t.title}」を削除しますか？`)) { topics = topics.filter(x => x.id !== id); saveTopics(); }
      break;
    }
    case 'sound': Sound.cycle(); break;
    case 'topics': notice = ''; view = 'topics'; break;
    case 'home': notice = ''; view = 'home'; break;
    case 'host': hostRoom(); return;
    case 'join': joinRoom($('#code').value); return;
    // お題編集
    case 'opt-add': if (editing.options.length < MAX_OPT) editing.options.push(''); break;
    case 'opt-del':
      if (editing.options.length > MIN_OPT) editing.options.splice(+el.dataset.i, 1);
      editing.count = Math.min(editing.count, Math.max(MIN_PICK, editing.options.length));
      break;
    case 'count-dec': editing.count = Math.max(MIN_PICK, editing.count - 1); break;
    case 'count-inc': editing.count = Math.min(MAX_PICK, editing.options.length, editing.count + 1); break;
    case 'edit-cancel': editing = null; notice = ''; view = 'topics'; break;
    case 'edit-save': {
      const title = editing.title.trim();
      const opts = editing.options.map(o => o.trim()).filter(Boolean);
      if (!title) notice = 'お題を入力してください';
      else if (opts.length < MIN_OPT) notice = `選択肢を${MIN_OPT}個以上入力してください`;
      else if (new Set(opts).size !== opts.length) notice = '同じ選択肢が重複しています';
      else if (editing.count > opts.length) notice = `出題数（${editing.count}個）が選択肢の数（${opts.length}個）より多くなっています`;
      else {
        const existing = topics.find(x => x.id === editing.id);
        const count = Math.max(MIN_PICK, Math.min(MAX_PICK, editing.count));
        if (existing) Object.assign(existing, { title, options: opts, count });
        else topics.push({ id: uid(), title, options: opts, count, bring: true });
        saveTopics(); editing = null; notice = ''; view = 'topics';
      }
      break;
    }
    // 並び替え
    case 'place': { const t = picker.slots.indexOf(null); if (t >= 0) picker.slots[t] = +el.dataset.i; break; }
    case 'unplace': picker.slots[r] = null; break;
    case 'up': [picker.slots[r - 1], picker.slots[r]] = [picker.slots[r], picker.slots[r - 1]]; break;
    case 'down': [picker.slots[r + 1], picker.slots[r]] = [picker.slots[r], picker.slots[r + 1]]; break;
    case 'submit-pick': submitPick(); return;
    // ルーム
    case 'start': case 'force': case 'next': case 'lobby': case 'reveal-all': send({ t: act }); return;
    case 'kick': send({ t: 'kick', id }); return;
    case 'mode': send({ t: 'mode', mode: el.dataset.mode }); return;
    case 'share':
      navigator.share({ title: 'ティアリストウォーズ', text: `ティアリストウォーズで遊ぼう！ 部屋コード: ${pub.code}`, url: `${location.origin}${location.pathname}?room=${encodeURIComponent(pub.code)}` }).catch(() => {});
      return;
    case 'copy': navigator.clipboard?.writeText(el.dataset.text).then(() => { el.textContent = 'コピーしました'; }, () => {}); return;
    case 'leave':
      if (confirm(net.isHost ? 'ホストが退出すると部屋が解散します。退出しますか？' : '退出しますか？')) {
        lastRoom = ''; session.set('tlw-room', '');
        leaveRoom();
      }
      return;
  }
  render();
});

// ===== ドラッグ＆ドロップ（指・マウス共通。タップ操作はそのまま使える） =====
function dropTarget(y) {
  const trayTop = document.querySelector('.tray')?.getBoundingClientRect().top ?? innerHeight;
  const slots = [...document.querySelectorAll('.slot[data-slot]')];
  if (!slots.length || y >= trayTop) return null;
  if (y < slots[0].getBoundingClientRect().top - 30 || y > slots.at(-1).getBoundingClientRect().bottom + 30) return null;
  const i = slots.findIndex(el => el.getBoundingClientRect().bottom >= y);
  return i < 0 ? slots.length - 1 : i;
}
app.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-drag]');
  if (!el || e.button > 0 || pending) return;
  // 指で並べ済みの項目を動かすのは ⠿ をつかんだときだけ（項目の上をなぞってスクロールできるように）
  if (el.dataset.drag === 'placed' && e.pointerType !== 'mouse' && !e.target.closest('.grip')) return;
  drag = { el, kind: el.dataset.drag, from: +(el.dataset.drag === 'placed' ? el.dataset.r : el.dataset.i), x0: e.clientX, y0: e.clientY, id: e.pointerId, active: false };
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.active) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return; // 少し動いただけならタップ扱い
    const rect = drag.el.getBoundingClientRect();
    drag.active = true;
    drag.dx = drag.x0 - rect.left; drag.dy = drag.y0 - rect.top;
    drag.ghost = drag.el.cloneNode(true);
    drag.ghost.className = 'drag-ghost';
    drag.ghost.style.width = rect.width + 'px';
    document.body.appendChild(drag.ghost);
    drag.el.classList.add('dragging');
  }
  e.preventDefault();
  drag.ghost.style.transform = `translate(${e.clientX - drag.dx}px, ${e.clientY - drag.dy}px) rotate(-2deg)`;
  const trayTop = document.querySelector('.tray')?.getBoundingClientRect().top ?? innerHeight;
  if (e.clientY < 70) scrollBy(0, -12); else if (e.clientY > trayTop - 50 && e.clientY < trayTop) scrollBy(0, 12);
  const t = dropTarget(e.clientY);
  document.querySelectorAll('.slot.drop').forEach(x => x.classList.remove('drop'));
  if (t != null) document.querySelector(`.slot[data-slot="${t}"]`)?.classList.add('drop');
}, { passive: false });
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag;
  drag = null;
  if (!d.active) return; // タップは click に任せる
  d.ghost.remove();
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 400);
  const t = e.type === 'pointerup' ? dropTarget(e.clientY) : null;
  if (t != null) {
    let item = d.from;
    if (d.kind === 'placed') { item = picker.slots[d.from]; picker.slots[d.from] = null; }
    putInSlot(item, t);
    Sound.play('click');
  }
  render();
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

// ===== 予期しないエラーを画面に出す（テストプレイで報告してもらえるように） =====
function showError(msg) {
  let el = document.getElementById('err');
  if (!el) {
    el = document.createElement('div');
    el.id = 'err';
    el.title = 'タップで閉じる';
    el.addEventListener('click', () => el.remove());
    document.body.appendChild(el);
  }
  el.textContent = `エラーが起きました（タップで閉じる）：${msg}`;
}
window.addEventListener('error', e => showError(e.message || String(e.error)));
window.addEventListener('unhandledrejection', e => showError(String(e.reason?.message ?? e.reason)));

window.addEventListener('beforeunload', () => { try { net.peer?.destroy(); } catch {} });

render();
</script>
</body>
